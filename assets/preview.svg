  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="70" y="70" width="1060" height="490" rx="24" fill="rgba(255,255,255,0.82)" stroke="rgba(18,38,58,0.18)"/>
  <text x="110" y="145" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#12263a">Bubble Sort Visualizer</text>
